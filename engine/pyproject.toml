[project]
name = "voice-engine"
version = "0.1.0"
description = "Standalone real-time voice engine (Pipecat)"
requires-python = "==3.12.*"
dependencies = [
  "pipecat-ai[webrtc,silero,deepgram,anthropic,cartesia,local-smart-turn-v3]",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "pydantic-settings",
  "httpx",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
voice-engine = "voice_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
